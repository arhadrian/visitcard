<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Business Card</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --accent: #2563eb;
            --border: #e2e8f0;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 380px;
            padding: 32px;
            text-align: center;
        }

        .profile-img {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--border);
            margin-bottom: 20px;
            background-color: #e2e8f0;
        }

        h1 { font-size: 1.5rem; font-weight: 600; margin-bottom: 4px; }
        .title { font-size: 0.9rem; color: var(--text-muted); margin-bottom: 24px; }
        .info-section { border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); padding: 20px 0; margin-bottom: 24px; text-align: left; }
        .info-item { margin-bottom: 12px; }
        .info-item:last-child { margin-bottom: 0; }
        .label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); margin-bottom: 2px; font-weight: 500; }
        .value a { color: var(--accent); text-decoration: none; font-weight: 500; font-size: 0.95rem; word-break: break-all; }
        
        .qr-container {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            background: var(--bg-color);
            padding: 16px;
            border-radius: 12px;
            border: 1px solid var(--border);
        }
        #qrcode { padding: 4px; background: #fff; }
        .qr-label { font-size: 0.8rem; color: var(--text-muted); margin-top: 8px; font-weight: 500; }
    </style>
</head>
<body>

    <div class="card">
        <!-- If your photo has a different name, change avatar.jpg below -->
        <img class="profile-img" src="avatar.jpg" alt="Profile Picture">
        
        <!-- 1. CHANGE YOUR NAME AND TITLE HERE -->
        <h1>Adrian Vidrașcu</h1>
        <div class="title">Lecturer, Ph. D.</div>
        <div class="title">Architect & Researcher</div>

        <div class="info-section">
            <div class="info-item">
                <div class="label">Email</div>
                <!-- 2. CHANGE YOUR EMAIL IN BOTH PLACES BELOW -->
                <div class="value"><a href="mailto: adrian.vidrascu@gmail.com">adrian.vidrascu@gmail.com</a></div>
            </div>
            <div class="info-item">
                <div class="label">Phone</div>
                <!-- 3. CHANGE YOUR PHONE IN BOTH PLACES BELOW -->
                <div class="value"><a href="tel:+40723271111">+40 723 271111</a></div>
            </div>
        </div>

       
        <div class="qr-container">
             <img class="qr-image" src="qr-code.png" alt="Contact QR Code">
              <div class="qr-label">Scan to save contact</div>
        </div>

    </div>

</body>
</html>
